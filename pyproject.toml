[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terravis"
version = "1.0.0"
description = "A framework for evaluating the world-grounded visual consistency in generated images, alongside other commonly used T2I evaluation metrics."
readme = "README.md"
license = "MIT AND Apache-2.0 AND BSD-3-Clause AND CC-BY-4.0 AND CC0-1.0 AND CC-BY-NC-4.0 AND PolyForm-Noncommercial-1.0.0 AND LicenseRef-TIIF-Bench-unlicensed"  # see THIRD_PARTY_NOTICES
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.11"
authors = [
    {name = "Shuai Fu"},
    {name = "Jing Gu"},
    {name = "Jian Zhou"},
    {name = "Zicheng Duan"},
    {name = "Gengze Zhou"},
    {name = "Qi Wu"},
]

dependencies = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "numpy>=2.1,<3.0",
    "pillow>=12.1.1",
    "accelerate>=1.13.0",
    "transformers>=5.5.4",  # 5.2/5.3 lack check_model_inputs (third_party/hidream)
    "huggingface-hub>=1.23.0",
    "diffusers>=0.40.0",  # Cosmos3DistilledModularPipeline
    "open-clip-torch>=3.3.0",
    "timm>=1.0.25",
    "einops>=0.8.0",  # third_party/hidream
    "requests>=2.28",
    "scipy>=1.17.1",
    "matplotlib>=3.11.0",  # unused in-package, kept for downstream plotting
    "openai>=2.26.0",
    "google-genai>=1.65.0",
    "safetensors>=0.8.0",
    "tqdm>=4.67.0",
    "pyyaml>=6.0",
    "fairscale>=0.4.13",
    "nvidia-ml-py>=13.595.45",  # accelerate --enable_cpu_affinity (multi-GPU t2i_generation.sh)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.0",
]
vllm = [
    "vllm==0.26.0",
]
flash-attn = [
    "flash-attn>=2.8.3",
]
aesthetic = [
    "aesthetic-predictor-v2-5>=2024.12.18.1",  # AGPL-3.0, laion_aesthetic_score only; older releases pin numpy<2
]

[project.urls]
Repository = "https://github.com/ShyFoo/TerraVis"
Paper = "https://arxiv.org/abs/2610.02959"
Dataset = "https://huggingface.co/datasets/ShyFoo/TerraVis-Annotations"

[project.scripts]
terravis-score = "terravis.cli.eval_scores:main"
terravis-generate = "terravis.cli.generate:main"
terravis-summarize = "terravis.cli.summarize:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"terravis.data" = ["*.json"]
"terravis.configs" = ["*.yaml"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/terravis/third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF100", "UP006", "UP007", "UP035", "UP045"]
